{{ $url := .Get "url" }}
{{ if .Get "newtab" }}
  <a
    href="{{ $url }}"
    class="leading-relaxed text-green-500 underline"
    target="_blank"
    >{{ .Get "text" }}</a
  >
{{ else }}
  <a href="{{ $url }}" class="leading-relaxed text-green-500 underline"
    >{{ .Get "text" }}</a
  >
{{ end }}
