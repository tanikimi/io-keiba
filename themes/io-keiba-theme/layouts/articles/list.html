{{ define "main" }}
  <div class="mt-6 w-full px-6">
    <h1 class="mb-2 text-2xl font-semibold">すべての記事</h1>
    {{ range .Pages }}
      <article>
        <a
          href="{{ .RelPermalink }}"
          class="block border-b border-dashed border-b-slate-300 py-4"
        >
          <div class="flex w-full items-center gap-4">
            {{ $thumbnail := (.Resources.GetMatch "thumbnail.jpg").Process "avif" }}
            <img
              src="{{ $thumbnail.RelPermalink }}"
              class="h-18 w-24 shrink-0 rounded object-cover"
            />
            <div class="flex flex-col justify-between">
              <h3 class="mb-2 line-clamp-3 leading-tight font-medium">
                {{ .Title }}
              </h3>
              <div class="text-xs font-light text-slate-400">
                {{ (index (.GetTerms "series") 0).LinkTitle }}
              </div>
            </div>
          </div>
        </a>
      </article>
    {{ end }}
    <div class="grid grid-cols-2 gap-x-4 gap-y-6"></div>
  </div>
{{ end }}
